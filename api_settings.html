<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h3 { margin-top: 0; color: #0055ff; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { background: #4caf50; color: white; padding: 12px; width: 100%; border: none; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; }
    .hint { font-size: 12px; color: #666; margin-bottom: 10px; line-height: 1.4;}
  </style>
</head>
<body>
  <h3>Gemini API・モデル設定</h3>
  
  <label>使用するモデル名</label>
  <div class="hint">「gemini-1.5-flash」「gemini-2.5-flash」などを指定できます。指定がない場合は最新の軽量モデルが使用されます。</div>
  <input type="text" id="modelName" placeholder="例: gemini-2.5-flash">

  <label>Gemini APIキー</label>
  <div class="hint">AIの自動割り振りを使用するために必要です。Google AI Studioから取得したAPIキーを入力してください。</div>
  <input type="text" id="apiKey" placeholder="AIzaSy...">

  <button onclick="save()">設定を保存する</button>
  <div id="saveNote" style="margin-top:14px;font-weight:bold;white-space:pre-wrap;line-height:1.7;"></div>

  <script>
    var loaded = false;   // 読み込めたか（読めないまま保存すると、今のAPIキーが消えるため）
    window.onload = function() {
      google.script.run.withSuccessHandler(function(data){
        loaded = true;
        document.getElementById('apiKey').value = data.apiKey;
        document.getElementById('modelName').value = data.modelName;
      }).withFailureHandler(function(e){
        saveNote('読み込めませんでした: ' + (e && e.message ? e.message : e) + '\n画面を開き直してください（読み込めるまで保存はできません。空のまま保存すると、今の設定が消えるため）。', '#c00');
      }).getApiSettings();
    };

    function save() {
      if (!loaded) { saveNote('設定を読み込めていないため、保存できません。画面を開き直してください。', '#c00'); return; }
      var data = {
        apiKey: document.getElementById('apiKey').value,
        modelName: document.getElementById('modelName').value
      };
      
      saveNote('保存しています...');
      google.script.run.withSuccessHandler(function(msg){
        saveNote(msg, 'green');
      }).withFailureHandler(function(e){
        saveNote('保存できませんでした: ' + (e && e.message ? e.message : e), '#c00');
      }).saveApiSettings(data);
    }
    // 保存の結果は画面の下に出す（画面は消さない。ウェブアプリでは上の帯と同じ「← メニューに戻る」も出す）
    function saveNote(text, color) {
      var m = document.getElementById('saveNote');
      if (!m) {
        m = document.createElement('div'); m.id = 'saveNote';
        m.style.cssText = 'margin-top:14px;font-weight:bold;white-space:pre-wrap;line-height:1.7;';
        document.body.appendChild(m);
      }
      var back = (color === 'green' && typeof WEBAPP_URL === 'string' && WEBAPP_URL)
        ? '<br><a href="' + WEBAPP_URL + '" target="_top" style="font-size:13px;">← メニューに戻る</a>' : '';
      m.style.color = color || '#0055ff';
      m.innerHTML = String(text == null ? '' : text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\n/g, '<br>') + back;
    }

  </script>
</body>
</html>
