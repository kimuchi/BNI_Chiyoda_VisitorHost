<script>
// === メンバーブックの組版 ===
// 配布しているPDF（Canvaで作った「BNI Active chapter Member」13(3)）と同じ見た目にしてある。
//   書体 … 源ノ明朝（Source Han Serif JP）の太字。Googleフォントの「Noto Serif JP」は同じ書体なので、それを読み込む
//          （読めないときはパソコンにある明朝体）
//   1ページ目 … 表紙（理念・チャプター紹介・メリット・タイムスケジュール・用語の説明・プレジデント挨拶・業種区分の説明）
//   2ページ目以降 … メンバーのカードを3列×6行（ページいっぱい。罫線で区切る）
// 文字の大きさ・位置は、そのPDFから測った値（pt）。長い文字は、書体を読み込んだあとに枠に収まるまで小さくする
// （まず1行のまま小さく、それでも入らない欄は2行にしてさらに小さく）。はみ出したり、ほかの文字に重なったりしない。
// 写真は配布先に閲覧権限がなくても出るよう、実体(base64)を埋め込む（画面のプレビューはサムネイル）。

function mbEsc(x){ var d=document.createElement('span'); d.textContent = x==null?'':x; return d.innerHTML; }
function mbLines(s){ return String(s==null?'':s).split('\n').filter(function(x){ return x.trim()!==''; }); }
function mbBr(s){ return mbEsc(s).replace(/\n/g,'<br>'); }

// ①②③… 20個まで
var MB_CIRCLE = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function mbCircle(i){ return i < MB_CIRCLE.length ? MB_CIRCLE.charAt(i) : String(i+1); }

var MB_RED = '#D61717';
// 会社での役職・BNIの役職の行（左端はカードの左から4pt）が、左上の番号の四角（右端はカードの左から34.2pt）を避ける幅
var MB_NO_AVOID = 32;
var MB_FONT = '"Noto Serif JP","Source Han Serif JP","Source Han Serif","源ノ明朝","Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif';
// 書体の読み込みは、ページの中のスクリプト（mbFitWhenReady）が行う。<link> で読むと、つながりにくいときに
// ページ全体が止まってしまう（印刷画面が開かない）ため
var MB_FONT_CSS = 'https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=block';
var MB_FONT_LINK = '<link rel="preconnect" href="https://fonts.googleapis.com">'
  +'<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>';

// 枠に収める欄：<div class="… fit" data-max="8" data-min="6" data-min2="5"><span>文字</span></div>
//   data-max … いつもの大きさ（pt）。1行のまま data-min まで小さくする
//   data-min2 … それでも入らなければ2行にして、ここまで小さくする（無ければ1行のまま）
//   avoid … 左からこの幅（pt）には文字を置かない（mbFitAll の data-avoid）
function mbFitBox(txt, cls, max, min, min2, avoid){
  return '<div class="'+cls+' fit" data-max="'+max+'" data-min="'+min+'"'+(min2?' data-min2="'+min2+'"':'')
    +(avoid?' data-avoid="'+avoid+'"':'')
    +' style="font-size:'+max+'pt;"><span>'+txt+'</span></div>';
}

   var tm = i===0 ? mbEsc(cv.scheduleFrom||'') : (i===items.length-1 ? mbEsc(cv.scheduleTo||'') : '');
   return '<div class="r"><span class="tm">'+tm+'</span><span class="it">'+mbCircle(i)+'　'+mbEsc(t)+'</span></div>';
 }).join('');
 if(!items.length && (cv.scheduleFrom||cv.scheduleTo)) sch = '<div class="r"><span class="tm">'+mbEsc(cv.scheduleFrom||'')+'</span></div>';

 // 用語の説明は「見出し行／説明行」の繰り返し
 var tl = mbLines(cv.terms), trm = '';
 for(var i=0;i<tl.length;i+=2){
   trm += '<div class="t">'+mbCircle(i/2)+mbEsc(tl[i])+'</div><div class="d">'+mbEsc(tl[i+1]||'')+'</div>';
 }
 // 業種区分の説明は2行まで（1行5つ。11以上のときは1行に入る数を増やし、文字を小さくする）。長い名前も枠に収める
 var nCat = (usedCats||[]).length, cols = Math.max(5, Math.ceil(nCat / 2)), lgPt = Math.round(11 * 5 / cols * 10) / 10;
 var lg = (usedCats||[]).map(function(c){
   return '<div class="it" style="width:'+(100/cols)+'%;"><i style="background:'+mbEsc(c.bg||'#ccc')+'"></i>'
     +mbFitBox(mbEsc(c.label||c.key), 'lgt', lgPt, Math.min(lgPt, 6), 4.5)+'</div>';
 }).join('');

 return '<div class="page cover">'
  +'<div class="cv-red">'
    +mbFitBox(mbEsc(cv.title), 'cv-ttl', 33, 18)
    +'<div class="cv-rule"></div>'
    +'<div class="cv-sec fitblock" style="top:52pt;height:72pt;" data-min="0.6"><div class="zi">'
      +'<div class="cv-h">■'+mbEsc(cv.philosophyTitle)+'</div>'
      +'<div class="cv-b">'+mbBr(cv.philosophy)+'</div></div></div>'
    +'<div class="cv-sec fitblock" style="top:124pt;height:85pt;" data-min="0.6"><div class="zi">'
      +'<div class="cv-h">■'+mbEsc(cv.aboutTitle)+'</div>'
      +'<div class="cv-b">'+mbBr(cv.about)+'</div></div></div>'
  +'</div>'
  +'<div class="cv-gray"><div class="cv-sec fitblock" style="top:2pt;height:73pt;" data-min="0.6"><div class="zi">'
    +'<div class="cv-h">■'+mbEsc(cv.benefitsTitle)+'</div>'
    +'<div class="cv-b">'+mbBr(cv.benefits)+'</div></div></div></div>'
  +'<div class="cv-box" style="left:3pt;top:292pt;width:364pt;height:473pt;">'
    +'<div class="cv-lbl">タイムスケジュール</div>'
    +'<div class="cv-sch fitblock" data-min="0.55"><div class="zi">'+sch+'</div></div>'
  +'</div>'
  +'<div class="cv-box" style="left:371pt;top:292pt;width:218pt;height:198pt;">'
    +'<div class="cv-lbl">'+mbEsc(cv.termsTitle)+'</div>'
    +'<div class="cv-trm fitblock" data-min="0.55"><div class="zi">'+trm+'</div></div>'
  +'</div>'
  +'<div class="cv-box" style="left:371pt;top:499pt;width:218pt;height:267pt;">'
    +'<div class="cv-lbl" style="font-weight:400;">'+mbEsc(cv.term)+' プレジデント挨拶</div>'
    +'<div class="cv-prs">'
      +(presidentPhoto ? '<img src="'+presidentPhoto+'">' : '<div class="noimg"></div>')
      +'<div class="r fitblock" data-min="0.55"><div class="zi"><div class="rl">'+mbBr(cv.prole)+'</div><div class="nm">'+mbEsc(cv.pname)+'</div></div></div>'
    +'</div>'
    +'<div class="cv-ptx fitblock" data-min="0.6"><div class="zi">'+mbBr(cv.ptext)+'</div></div>'
  +'</div>'
  +'<div class="cv-lg"><div class="cv-lbl">業種区分説明</div><div class="cv-lgi">'+lg+'</div></div>'
 +'</div>';
}

// メンバーカード1枚。idx … 画面のプレビューで押したときに開く方（印刷では付けない）
function mbCardHtml(m, no, photo, idx){
 var c = catOf(m.cat), bg = (c && c.bg) ? c.bg : '#E7E6E6';
 return '<div class="c'+(idx!=null?' pick':'')+'"'+(idx!=null?' data-i="'+idx+'"':'')+'>'
  +'<div class="hd" style="background:'+mbEsc(bg)+'"></div>'
  +(photo ? '<img class="ph" src="'+photo+'">' : '')
  +'<div class="no">'+mbEsc(no)+'</div>'
  +mbFitBox(mbEsc(m.title), 'cat', 7, 4.5, 3.8)
  +mbFitBox(mbEsc(m.company), 'co', 7, 4.5, 3.8)
  +'<div class="mid'+(m.position && m.role ? ' full' : '')+'">'
    +(m.position ? mbFitBox(mbEsc(m.position), 'ps', 7, 4.25, 0, MB_NO_AVOID) : '')
    +(m.role ? mbFitBox(mbEsc(m.role), 'bn', 6, 3.8, 0, MB_NO_AVOID).replace(' data-avoid=', m.position ? ' data-avoid=' : ' data-lower="1" data-avoid=') : '')
    +mbFitBox(mbEsc(m.name), 'nm', 14, 9)
  +'</div>'
  +mbFitBox(mbBr(m.comment), 'cm', 8, 6, 4.8)
  +'<div class="bar b1">最も紹介して欲しいカテゴリー</div>'
  +mbFitBox(mbBr(m.refer), 'rf', 8, 5.5, 4.6)
  +'<div class="bar b2">協業したいカテゴリー</div>'
  +mbFitBox(mbBr(m.collab), 'cb', 8, 5.5, 4.6)
 +'</div>';
}

// --- 文字を枠に収める（書体を読み込んだあとに、実際の幅で測る）---
// この関数は冊子のHTMLにもそのまま埋め込む（印刷・配布用HTML・画面のプレビューで同じ動き）。何度呼んでも同じ結果になる
//   data-avoid … 左からこの幅（pt）には文字を置かない（会社での役職・BNIの役職の行は、左上の番号の四角にかかる）。
//                真ん中に置いて四角に重なるときだけ、四角の右に寄せて収め直す
//   data-lower … （BNIの役職だけの方）四角の右に入らなければ、お名前ごと四角の下に下げる（親の .mid に low）
function mbFitAll(doc){
  var q = function(sel){ return Array.prototype.slice.call(doc.querySelectorAll(sel)); };
  var fit = function(el, t){
    var max = parseFloat(el.getAttribute('data-max')), min = parseFloat(el.getAttribute('data-min'));
    var min2 = parseFloat(el.getAttribute('data-min2') || '0'), cs = doc.defaultView.getComputedStyle(el);
    var W = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = el.clientHeight, s;
    el.classList.remove('wrap'); t.style.maxWidth = '';
    for(s = max; s >= min - 0.001; s -= 0.25){
      el.style.fontSize = s + 'pt';
      if(t.offsetWidth <= W + 0.5 && t.offsetHeight <= H + 0.5) return true;
    }
    if(min2){
      el.classList.add('wrap'); t.style.maxWidth = W + 'px';
      for(s = min; s >= min2 - 0.001; s -= 0.25){
        el.style.fontSize = s + 'pt';
        if(t.offsetHeight <= H + 0.5 && t.scrollWidth <= W + 0.5) return true;
      }
    }
    return false;
  };
  // 文字（span）が、そのカードの番号の四角に重なるか
  var hitsNo = function(el, t){
    var c = el.closest ? el.closest('.c') : null, n = c ? c.querySelector('.no') : null;
    if(!n) return false;
    var a = t.getBoundingClientRect(), b = n.getBoundingClientRect();
    return a.left < b.right - 0.5 && a.right > b.left + 0.5 && a.top < b.bottom - 0.5 && a.bottom > b.top + 0.5;
  };
  q('.fit').forEach(function(el){
    var t = el.firstElementChild; if(!t || !t.textContent) return;
    var av = parseFloat(el.getAttribute('data-avoid') || '0'), low = el.getAttribute('data-lower') ? el.parentNode : null;
    el.removeAttribute('data-over'); el.style.paddingLeft = '';
    if(low) low.classList.remove('low');
    var ok = fit(el, t);
    if(av && (!ok || hitsNo(el, t))){
      el.style.paddingLeft = av + 'pt';                 // 四角の右に寄せて収め直す
      ok = fit(el, t);
      if(!ok && low){                                  // それでも入らない帯は、行ごと四角の下に下げて、幅いっぱいで収める
        low.classList.add('low'); el.style.paddingLeft = '';
        ok = fit(el, t) && !hitsNo(el, t);
      }
    }
    if(!ok) el.setAttribute('data-over', '1');         // いちばん小さくしても入らない（はみ出た分は枠で切る）
  });
  // 何行もある欄（表紙）：中身（.zi）をまとめて縮める（zoom）。枠の大きさは変えない
  q('.fitblock').forEach(function(el){
    var zi = el.firstElementChild, min = parseFloat(el.getAttribute('data-min') || '0.6'), z;
    if(!zi) return;
    el.removeAttribute('data-over');
    for(z = 1; z >= min - 0.001; z -= 0.025){
      zi.style.zoom = z;
      if(el.scrollHeight <= el.clientHeight + 1 && el.scrollWidth <= el.clientWidth + 1) return;
    }
    el.setAttribute('data-over', '1');
  });
}
// 書体（Googleフォント）を読み込んでから収める。読めないとき・8秒たっても届かないときは、パソコンの明朝体で収める
// （あとから書体が届いたら、収め直して refit を呼ぶ）
function mbFitWhenReady(win, cssUrl, done, refit){
  var doc = win.document, finished = false;
  var go = function(){ if(finished) return; finished = true; try{ mbFitAll(doc); }catch(e){} if(done) done(); };
  var fonts = function(){
    try{
      var text = doc.body ? doc.body.textContent : '';
      var loads = ['400','500','700'].map(function(w){ return doc.fonts.load(w+' 12pt "Noto Serif JP"', text || 'あ'); });
      Promise.all(loads).then(function(){ return doc.fonts.ready; }).then(go, go);
    }catch(e){ setTimeout(go, 300); }
  };
  try{
    var l = doc.createElement('link');
    l.rel = 'stylesheet'; l.href = cssUrl; l.onload = fonts; l.onerror = go;
    (doc.head || doc.documentElement).appendChild(l);
    doc.fonts.addEventListener('loadingdone', function(){ if(finished) try{ mbFitAll(doc); if(refit) refit(); }catch(e){} });
  }catch(e){ fonts(); }
  setTimeout(go, 8000);
}

// 冊子全体。opts … { photos: 氏名→画像, autoPrint: 収めたあと印刷画面を開く, pick: カードを押すと編集（プレビュー）,
//                    cover: 表紙を入れる（既定 true） }
function bookHtml(opts){
 var o = opts || {}, ph = o.photos || photosB64, cv = cover || {}, per = 18, pages = '';
 var used = (cats||[]).filter(function(c){ return members.some(function(m){ return m.cat === c.key; }); });
 if(o.cover !== false) pages += mbCoverHtml(cv, ph[cv.pname] || '', used.length ? used : cats);
 for(var s=0; s<members.length; s+=per){
   var cards = members.slice(s, s+per).map(function(m,i){
     return mbCardHtml(m, m.no || (s+i+1), ph[m.name] || '', o.pick ? s+i : null);
   });
   while(cards.length < per) cards.push('<div class="c"></div>');   // 最後のページも罫線はそのまま
   pages += '<div class="page"><div class="grid">'+cards.join('')+'</div></div>';
 }
 var script = mbFitAll.toString() + '\n' + mbFitWhenReady.toString() + '\n'
   + 'mbFitWhenReady(window, ' + JSON.stringify(MB_FONT_CSS) + ', function(){ document.documentElement.setAttribute("data-fitted","1");'
   + (o.autoPrint ? ' setTimeout(function(){ window.focus(); window.print(); }, 200);' : '')
   + (o.pick ? ' try{ parent.postMessage({ mbFitted: 1 }, "*"); }catch(e){}' : '')
   + ' }' + (o.pick ? ', function(){ try{ parent.postMessage({ mbFitted: 1 }, "*"); }catch(e){} }' : '') + ');\n'
   + (o.pick ? 'document.addEventListener("click", function(e){ var c = e.target.closest ? e.target.closest(".c.pick") : null;'
             + ' if(c) parent.postMessage({ mbOpen: +c.getAttribute("data-i") }, "*"); });\n' : '');
 return '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">'
  +'<title>'+mbEsc(cv.title || 'BNI メンバーブック')+'</title>'+MB_FONT_LINK
