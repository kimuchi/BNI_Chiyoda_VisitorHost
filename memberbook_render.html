<script>
// === メンバーブックの組版 ===
// 配布版PDFと同じ見た目になるように作ってある。
//   1ページ目 … 表紙（理念・チャプター紹介・メリット・タイムスケジュール・
//                用語の説明・プレジデント挨拶・業種区分の凡例）
//   2ページ目以降 … メンバーカードを3列×6行
// 写真は配布先に閲覧権限がなくても出るよう、実体(base64)を埋め込む。

function mbEsc(x){ var d=document.createElement('span'); d.textContent = x==null?'':x; return d.innerHTML; }
function mbLines(s){ return String(s==null?'':s).split('\n').filter(function(x){ return x.trim()!==''; }); }
function mbBr(s){ return mbEsc(s).replace(/\n/g,'<br>'); }

// ①②③… 20個まで
var MB_CIRCLE = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function mbCircle(i){ return i < MB_CIRCLE.length ? MB_CIRCLE.charAt(i) : String(i+1); }

function mbBookCss(){
 return '@page{size:A4;margin:0;}'
  +'*{box-sizing:border-box;margin:0;padding:0;}'
  +'body{font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;'
  +'-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;}'
  +'.page{width:210mm;height:297mm;padding:5mm;overflow:hidden;page-break-after:always;position:relative;}'
  +'.page:last-child{page-break-after:auto;}'

  /* --- 表紙 --- */
  +'.ttl{background:#C00000;color:#fff;font-weight:bold;font-size:21pt;text-align:center;'
  +'padding:1.8mm 0 2.6mm;letter-spacing:.01em;}'
  +'.ttl u{text-decoration:none;border-bottom:1.2pt solid #fff;padding-bottom:1mm;}'
  +'.red{background:#C00000;color:#fff;padding:2.2mm 4mm 2.8mm;}'
  +'.gray{background:#D9D9D9;color:#111;padding:2.2mm 4mm 2.8mm;}'
  +'.h{font-weight:bold;font-size:12.5pt;margin-bottom:1.2mm;}'
  +'.h .sq{font-size:12pt;margin-right:1mm;}'
  +'.bd{font-size:9.5pt;line-height:1.45;padding-left:4mm;}'
  +'.gray .bd{font-size:10pt;line-height:1.65;padding-left:2mm;}'

  +'.cols{display:flex;gap:2.5mm;margin-top:2mm;}'
  +'.cl{flex:1.32;min-width:0;border:0.6pt solid #000;padding:2mm;}'
  +'.cr{flex:1;min-width:0;display:flex;flex-direction:column;gap:2.5mm;}'
  +'.cr>div{border:0.6pt solid #000;padding:2mm;}'
  +'.lbl{display:inline-block;background:#C00000;color:#fff;font-weight:bold;font-size:10.5pt;'
  +'padding:0.8mm 3mm;margin-bottom:2mm;}'

  +'.sch{display:flex;font-size:9.5pt;}'
  +'.schT{width:13mm;flex-shrink:0;color:#C00000;font-weight:bold;}'
  +'.schL{flex:1;min-width:0;}'
  +'.schR{display:flex;gap:1.5mm;color:#C00000;font-weight:bold;line-height:1.3;margin-bottom:0.2mm;}'
  +'.schR .n{flex-shrink:0;}'

  +'.trm{font-size:8pt;line-height:1.35;}'
  +'.trm .t{color:#C00000;font-weight:bold;}'
  +'.trm .d{padding-left:2.5mm;margin-bottom:0.8mm;}'

  +'.pz{display:flex;gap:2mm;margin-bottom:1.5mm;}'
  +'.pz img{width:15mm;height:15mm;object-fit:cover;background:#eee;flex-shrink:0;}'
  +'.pz .r{flex:1;min-width:0;font-size:9pt;line-height:1.5;}'
  +'.pz .nm{font-size:13pt;font-weight:bold;text-align:center;margin-top:1mm;}'
  +'.ptxt{font-size:8pt;line-height:1.45;text-align:justify;}'

  +'.lg{margin-top:2mm;border:0.6pt solid #000;padding:1.6mm;}'
  +'.lgi{display:flex;flex-wrap:wrap;gap:1.5mm 2mm;margin-top:1.5mm;}'
  +'.lgi span{display:flex;align-items:center;gap:1.5mm;width:calc(20% - 2mm);font-size:10pt;}'
  +'.lgi i{width:5mm;height:5mm;display:inline-block;flex-shrink:0;}'

  /* --- メンバーカード --- */
  +'.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,1fr);'
  +'gap:1.2mm;height:100%;}'
  +'.c{border:0.6pt solid #000;overflow:hidden;display:flex;flex-direction:column;}'
  +'.hd{position:relative;padding:1.2mm 1.5mm 1.5mm;min-height:19mm;}'
  +'.hd .ph{float:right;width:19mm;height:19mm;object-fit:cover;background:#ddd;margin:-1.2mm -1.5mm 0 1.5mm;}'
  +'.hd .no{position:absolute;left:1.2mm;top:1.2mm;background:#E7E6E6;color:#111;'
  +'font-weight:bold;font-size:10pt;min-width:6mm;height:6mm;line-height:6mm;text-align:center;'
  +'padding:0 1mm;border-radius:1mm;}'
  +'.hd .cat{margin-left:7.5mm;font-size:7pt;font-weight:bold;line-height:1.25;}'
  +'.hd .co{margin-left:7.5mm;font-size:7pt;line-height:1.25;}'
  +'.hd .ti{font-size:7pt;text-align:center;margin-top:0.8mm;}'
  +'.hd .nm{font-size:13pt;font-weight:bold;text-align:center;letter-spacing:.04em;line-height:1.2;}'
  +'.cm{font-size:7pt;text-align:center;padding:1mm 1.5mm;line-height:1.3;}'
  +'.bar{background:#000;color:#fff;font-size:7.5pt;text-align:center;'
  +'border-radius:2.5mm;margin:0 1.5mm;padding:0.3mm 0;}'
  +'.tx{font-size:7pt;text-align:center;padding:0.7mm 1.5mm;line-height:1.3;}';
}

// 表紙ページ
function mbCoverHtml(cv, presidentPhoto){
 var sch = mbLines(cv.schedule).map(function(t,i){
   return '<div class="schR"><span class="n">'+mbCircle(i)+'</span><span>'+mbEsc(t)+'</span></div>';
 }).join('');

 // 用語の説明は「見出し行／説明行」の繰り返し
 var tl = mbLines(cv.terms), trm = '';
 for(var i=0;i<tl.length;i+=2){
   trm += '<div class="t">'+mbCircle(i/2)+mbEsc(tl[i])+'</div>'
        + '<div class="d">'+mbEsc(tl[i+1]||'')+'</div>';
 }

 var lg = (cats||[]).map(function(c){
   return '<span><i style="background:'+mbEsc(c.bg||'#ccc')+'"></i>'+mbEsc(c.label||c.key)+'</span>';
 }).join('');

 return '<div class="page">'
  +'<div class="ttl"><u>'+mbEsc(cv.title)+'</u></div>'
  +'<div class="red">'
    +'<div class="h"><span class="sq">■</span>'+mbEsc(cv.philosophyTitle)+'</div>'
    +'<div class="bd">'+mbBr(cv.philosophy)+'</div>'
    +'<div class="h" style="margin-top:3mm;"><span class="sq">■</span>'+mbEsc(cv.aboutTitle)+'</div>'
    +'<div class="bd">'+mbBr(cv.about)+'</div>'
  +'</div>'
  +'<div class="gray">'
    +'<div class="h"><span class="sq" style="color:#C00000;">■</span>'+mbEsc(cv.benefitsTitle)+'</div>'
    +'<div class="bd">'+mbBr(cv.benefits)+'</div>'
  +'</div>'
  +'<div class="cols">'
    +'<div class="cl"><span class="lbl">タイムスケジュール</span>'
      +'<div class="sch"><div class="schT">'+mbEsc(cv.scheduleFrom)+'</div><div class="schL">'+sch+'</div></div>'
      +'<div class="sch" style="margin-top:0.5mm;"><div class="schT">'+mbEsc(cv.scheduleTo)+'</div><div class="schL"></div></div>'
    +'</div>'
    +'<div class="cr">'
      +'<div><span class="lbl">'+mbEsc(cv.termsTitle)+'</span><div class="trm">'+trm+'</div></div>'
      +'<div><span class="lbl">'+mbEsc(cv.term)+' プレジデント挨拶</span>'
        +'<div class="pz">'
          +(presidentPhoto ? '<img src="'+presidentPhoto+'">'
                           : '<div style="width:15mm;height:15mm;background:#eee;flex-shrink:0;"></div>')
          +'<div class="r">'+mbBr(cv.prole)+'</div>'
        +'</div>'
        +'<div class="pz nmw"><div class="nm" style="flex:1;">'+mbEsc(cv.pname)+'</div></div>'
        +'<div class="ptxt">'+mbBr(cv.ptext)+'</div>'
      +'</div>'
    +'</div>'
  +'</div>'
  +'<div class="lg"><span class="lbl">業種区分説明</span><div class="lgi">'+lg+'</div></div>'
 +'</div>';
}

// メンバーカード1枚
function mbCardHtml(m, no, photo){
 var c = catOf(m.cat), bg = (c && c.bg) ? c.bg : '#E7E6E6';
 return '<div class="c">'
  +'<div class="hd" style="background:'+mbEsc(bg)+'">'
    +(photo ? '<img class="ph" src="'+photo+'">' : '<div class="ph" style="float:right;width:19mm;height:19mm;background:#ddd;margin:-1.2mm -1.5mm 0 1.5mm;"></div>')
    +'<span class="no">'+mbEsc(no)+'</span>'
    +'<div class="cat">'+mbEsc(m.title)+'</div>'
    +'<div class="co">'+mbEsc(m.company)+'</div>'
    +'<div class="ti">'+mbEsc(m.role)+'</div>'
    +'<div class="nm">'+mbEsc(m.name)+'</div>'
  +'</div>'
  +'<div class="cm">'+mbBr(m.comment)+'</div>'
  +'<div class="bar">最も紹介して欲しいカテゴリー</div>'
  +'<div class="tx">'+mbBr(m.refer)+'</div>'
  +'<div class="bar">協業したいカテゴリー</div>'
  +'<div class="tx">'+mbBr(m.collab)+'</div>'
 +'</div>';
}

// 冊子全体
function bookHtml(){
 var cv = cover || {}, per = 18, pages = '';
 pages += mbCoverHtml(cv, photosB64[cv.pname] || '');
 for(var s=0; s<members.length; s+=per){
   var cards = members.slice(s, s+per).map(function(m,i){
     return mbCardHtml(m, m.no || (s+i+1), photosB64[m.name] || '');
   }).join('');
   pages += '<div class="page"><div class="grid">'+cards+'</div></div>';
 }
 return '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">'
  +'<title>'+mbEsc(cv.title || 'BNI メンバーブック')+'</title>'
  +'<style>'+mbBookCss()+'</style></head><body>'+pages+'</body></html>';
}
</script>
