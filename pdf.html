<!DOCTYPE html>
<html>
<head><base target="_top"></head>
<body style="font-family: sans-serif; padding: 20px;">
  <p>添付PDFから番号と氏名を抽出し、「メンバーリスト」シートに保存します（Geminiで解析）。</p>
  <form id="pdfForm" onsubmit="event.preventDefault(); uploadPdf();">
    <input type="file" name="pdfFile" id="pdfFile" accept=".pdf" required onchange="showSize()"><br>
    <div id="sizeInfo" style="font-size:12px; color:#666; margin:6px 0;"></div>
    <button type="submit" id="btn" style="padding: 8px 16px;">アップロードして解析</button>
  </form>
  <div id="msg" style="margin-top:15px; white-space:pre-wrap; font-weight:bold; color:#0066cc;"></div>

  <script>
    function showSize() {
      var f = document.getElementById('pdfFile').files[0];
      var el = document.getElementById('sizeInfo');
      if (!f) { el.innerText = ''; return; }
      var mb = f.size / 1048576;
      el.innerText = 'ファイルサイズ: ' + mb.toFixed(2) + ' MB';
      el.style.color = (mb > 15) ? '#d00' : '#666';
      if (mb > 15) el.innerText += '（大きすぎます。約15MB以下にしてください）';
    }
    function uploadPdf() {
      var f = document.getElementById('pdfFile').files[0];
      if (f && (f.size / 1048576) > 15) {
        alert('PDFが大きすぎます（約15MB以下にしてください）。');
        return;
      }
      document.getElementById('btn').disabled = true;
      document.getElementById('msg').style.color = '#0066cc';
      document.getElementById('msg').innerText = 'Geminiで解析中です。数秒〜十数秒かかります...';
      var form = document.getElementById('pdfForm');
      google.script.run.withSuccessHandler(function(res){
        var ok = res && res.ok;
        document.getElementById('msg').innerText = (res && res.message) ? res.message : String(res);
        document.getElementById('msg').style.color = ok ? 'green' : '#d00';
        document.getElementById('btn').disabled = false;
      }).withFailureHandler(function(err){
        var detail = (err && err.message) ? err.message : String(err);
        document.getElementById('msg').innerText =
          'サーバーエラー: ' + detail + '\n\n' +
          '▼ 原因の確認方法\n' +
          '1) 上のファイルサイズが大きすぎないか（15MB以下推奨）\n' +
          '2) メニュー「⚙️ Gemini接続テスト」を実行し、Geminiとの通信を確認\n' +
          '3) Apps Scriptエディタ →左メニュー「実行数」で最新の processPdfForm の\n' +
          '   赤いエラー詳細（スタックトレース）を確認';
        document.getElementById('msg').style.color = '#d00';
        document.getElementById('btn').disabled = false;
      }).processPdfForm(form);
    }
  </script>
</body>
</html>
