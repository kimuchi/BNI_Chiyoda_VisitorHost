<!DOCTYPE html>
<html>
<head><base target="_top"></head>
<body style="font-family: sans-serif; padding: 20px;">
  <p style="font-size:14px; color:#333;">メンバーブックのPDFをアップロードします。<br>※更新してもURLは変わらないため、メール送信後でも最新版が見られます。</p>
  <div>
    <input type="file" id="pdfFile" accept=".pdf" required><br><br>
    <button id="btn" onclick="uploadPdf()" style="padding:8px 16px; background:#0055ff; color:#fff; border:none; font-weight:bold; border-radius:4px;">アップロード</button>
  </div>
  <div id="msg" style="margin-top:15px; font-weight:bold; white-space:pre-wrap;"></div>

  <script>
    // フォーム送信ではなく base64 文字列で送る
    // （フォーム＋ファイル送信はサーバー関数に到達せず「サーバーエラー」になるため）
    function uploadPdf() {
      var f = document.getElementById('pdfFile').files[0];
      if (!f) { alert('ファイルを選択してください。'); return; }
      document.getElementById('btn').disabled = true;
      document.getElementById('msg').style.color = '#0055ff';
      document.getElementById('msg').innerText = 'アップロード・更新中です...';

      var reader = new FileReader();
      reader.onload = function() {
        var base64 = String(reader.result).split(',')[1];
        google.script.run.withSuccessHandler(function(res){
          if (res && res.error) {
            document.getElementById('msg').innerText = res.error;
            document.getElementById('msg').style.color = 'red';
          } else {
            document.getElementById('msg').innerHTML = res.msg + "<br><br><a href='" + res.url + "' target='_blank'>現在のURLを確認</a>";
            document.getElementById('msg').style.color = 'green';
          }
          document.getElementById('btn').disabled = false;
        }).withFailureHandler(function(err){
          document.getElementById('msg').innerText = 'エラー: ' + ((err && err.message) ? err.message : err);
          document.getElementById('msg').style.color = 'red';
          document.getElementById('btn').disabled = false;
        }).uploadMemberBookBase64(base64, f.name);
      };
      reader.onerror = function() {
        document.getElementById('msg').innerText = 'ブラウザでのファイル読み込みに失敗しました。';
        document.getElementById('msg').style.color = 'red';
        document.getElementById('btn').disabled = false;
      };
      reader.readAsDataURL(f);
    }
  </script>
</body>
</html>
