<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h3 { margin-top: 0; color: #0055ff; }
    textarea { width: 100%; height: 200px; box-sizing: border-box; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: sans-serif; line-height: 1.5; }
    button { background: #4caf50; color: white; padding: 12px; width: 100%; border: none; font-weight: bold; font-size: 15px; border-radius: 4px; cursor: pointer; }
    .hint { font-size: 12px; color: #666; margin-bottom: 10px; line-height: 1.4;}
  </style>
</head>
<body>
  <h3>割り振り表の特記事項設定</h3>
  <div class="hint">割り振り表の下部に記載する注意事項や案内文を自由に編集できます。</div>

  <div style="font-size:12px;color:#666;line-height:1.7;margin-bottom:8px;">長い行は<b>自動で折り返されます</b>ので、無理に改行しなくて大丈夫です。<br>文字色は全行そろいます（「※」で始まる行だけ太字になります）。</div>
  <textarea id="noteText"></textarea>

  <button id="saveBtn" onclick="save()">設定を保存する</button>
  <div id="saveNote" style="margin-top:14px;font-weight:bold;white-space:pre-wrap;line-height:1.7;"></div>

  <script>
    // 保存の結果は画面の下に出す（画面は消さない。ウェブアプリでは上の帯と同じ「← メニューに戻る」も出す）
    function saveNote(text, color) {
      var m = document.getElementById('saveNote');
      if (!m) {
        m = document.createElement('div'); m.id = 'saveNote';
        m.style.cssText = 'margin-top:14px;font-weight:bold;white-space:pre-wrap;line-height:1.7;';
        document.body.appendChild(m);
      }
      var back = (color === 'green' && typeof WEBAPP_URL === 'string' && WEBAPP_URL)
        ? '<br><a href="' + WEBAPP_URL + '" target="_top" style="font-size:13px;">← メニューに戻る</a>' : '';
      m.style.color = color || '#0055ff';
      m.innerHTML = String(text == null ? '' : text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\n/g, '<br>') + back;
    }

    window.onload = function() {
      google.script.run.withSuccessHandler(function(data){
        document.getElementById('noteText').value = data;
      }).getAllocationNote();
    };

    function save() {
      var text = document.getElementById('noteText').value;
      var btn = document.getElementById('saveBtn');
      btn.disabled = true;
      saveNote('保存しています...');
      google.script.run.withSuccessHandler(function(msg){
        btn.disabled = false;
        saveNote(msg, 'green');
      }).withFailureHandler(function(e){
        btn.disabled = false;
        saveNote('保存できませんでした: ' + (e && e.message ? e.message : e), '#c00');
      }).saveAllocationNote(text);
    }
  </script>
</body>
</html>
