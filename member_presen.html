<!DOCTYPE html>
<html><head><base target="_top">
<style>
 body{font-family:sans-serif;padding:20px;font-size:14px;margin:0;color:#222;}
 h3{margin:0 0 6px;color:#c00000;}
 .hint{font-size:12px;color:#666;line-height:1.7;margin-bottom:12px;}
 .warn{background:#fffbe8;border-left:4px solid #ffc107;padding:9px 12px;font-size:12px;
       border-radius:0 4px 4px 0;margin-bottom:10px;line-height:1.7;}
 .err{background:#fdecea;border-left:4px solid #d93025;padding:9px 12px;font-size:12px;
      border-radius:0 4px 4px 0;margin-bottom:10px;line-height:1.7;}
 select{padding:6px;font-size:14px;border:1px solid #ccc;border-radius:4px;max-width:260px;}
 .row{margin-top:8px;}
 .row label{color:#666;font-size:13px;margin-right:4px;}
 .sub{font-size:11.5px;color:#888;margin-top:3px;}
 .tidy{background:#fff;color:#c00000;border:1px solid #c00000;border-radius:4px;
       padding:4px 10px;font-size:11.5px;font-weight:bold;cursor:pointer;margin-top:6px;}
 .cols{display:flex;gap:14px;align-items:flex-start;margin-top:12px;}
 .cols>div{flex:1;min-width:0;}
 h4{font-size:13px;margin:0 0 6px;color:#c00000;}
 table{border-collapse:collapse;width:100%;font-size:12px;}
 th{background:#c00000;color:#fff;padding:5px 8px;text-align:left;white-space:nowrap;}
 td{padding:5px 8px;border-bottom:1px solid #eee;}
 td.num{text-align:right;white-space:nowrap;color:#666;}
 td.n{width:22px;color:#aaa;text-align:right;}
 tr.first td{background:#fff5f5;font-weight:bold;}
 tr.unknown td{color:#b26b00;}
 #gen{margin-top:14px;width:100%;padding:14px;color:#fff;border:none;border-radius:8px;
      font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#c00000,#e53935);}
 #gen:disabled{opacity:.4;cursor:not-allowed;}
 #msg{margin-top:12px;font-weight:bold;white-space:pre-wrap;}
 a.dl{display:inline-block;margin-top:8px;background:#0055ff;color:#fff;padding:8px 16px;
      border-radius:5px;text-decoration:none;font-weight:bold;font-size:13px;}
</style></head>
<body>
 <h3>🎤 メンバープレゼンスライドの作成</h3>
 <div class="hint">
   「メンバー名簿」と「メンバー写真」から、業種区分ごとの扉ページと個人ページを作ります。<br>
   発表の順番は<b>名簿の行順</b>。業種区分は<b>いつも同じ並び</b>で、<b>始まりの区分だけ</b>が週ごとにずれます。<br>
   個人ページの<b>30秒カウントダウン</b>は、終わると自動で次のスライドへ進みます。
 </div>
 <div class="err"  id="err"  style="display:none;"></div>
 <div class="warn" id="warn" style="display:none;"></div>

 <div class="row"><label>開催日</label><select id="date" onchange="onDate()"></select>
   <span id="count" style="font-size:12px;color:#666;margin-left:8px;"></span></div>
 <div class="row"><label>始まりの業種区分</label><select id="start" onchange="render()"></select>
   <div class="sub" id="startNote"></div></div>
 <div class="row"><label>2分30秒プレゼンの方</label><select id="long" onchange="render()"></select>
   <div class="sub" id="longNote">選ぶと、その方の個人ページだけ <b>2:30</b> からのカウントダウンになります（いない日は「（なし）」のまま）。</div>
 </div>
 <div class="row">
   <label><input type="checkbox" id="auto" checked onchange="render()">
     個人ページは<b>カウントダウンが終わったら自動で次へ</b>進む</label>
   <div class="sub">外すと、クリックで進む形になります。扉ページはいつもクリックで進みます。</div>
 </div>

 <div class="cols">
   <div>
     <h4>この日の順番</h4>
     <table id="ord"></table>
   </div>
   <div>
     <h4>出来上がりの内訳</h4>
     <table id="sum"></table>
   </div>
 </div>

 <button id="gen" onclick="gen()" disabled>PowerPointを作成する</button>
 <div id="msg"></div>
<?!= include('slides_layout') ?>
<script>
// ===== 画面 =====
var ctx=null, startKey='', working=false;
window.onload=function(){ load(); };
function load(){ google.script.run.withSuccessHandler(init).withFailureHandler(fail).getMemberPresenContext(); }
function esc(x){ var d=document.createElement('span'); d.textContent=x==null?'':x; return d.innerHTML; }
function live(){ return ctx.blocks.filter(function(b){ return b.count>0; }); }
function membersOf(g){ return ctx.members.filter(function(m){ return m.blockKey===g; }); }

function init(c){
  if(!c.ok){ fail({message:c.message}); return; }
  ctx=c;
  if(!c.template || !c.template.registered){
    var e=document.getElementById('err'); e.style.display='block';
    e.innerHTML='<b>テンプレートが未登録です。</b><br>'
      +'「⚙️ 設定 ＞ 大きなスライド」の<b>メンバープレゼン</b>に、Driveに置いたpptxのリンクを登録してください。';
  }
  var notes=[];
  var unknown=ctx.blocks.filter(function(b){ return !b.known && b.count>0; });
  if(unknown.length) notes.push('業種区分マスタに無い区分があります（そのままの名前で扉ページを作ります）: '
    +unknown.map(function(b){ return esc(b.block)+'（'+b.count+'名）'; }).join('、'));
  var noCat=c.members.filter(function(m){ return !m.cat; });
  if(noCat.length) notes.push('業種区分が空の方が'+noCat.length+'名います（この方はスライドに出ません）: '
    +noCat.map(function(m){ return esc(m.name); }).join('、'));
  var noPhoto=c.members.filter(function(m){ return m.blockKey && !m.hasPhoto; });
  if(noPhoto.length) notes.push('写真が見つからない方が'+noPhoto.length+'名います（写真なしで作ります）: '
    +noPhoto.map(function(m){ return esc(m.name); }).join('、'));
  if((c.unusedCategories||[]).length) notes.push('誰も使っていない業種区分が業種区分マスタに残っています: <b>'
    +c.unusedCategories.map(esc).join('、')+'</b>'
    +'<br><button class="tidy" onclick="tidy()">使われていない業種区分を消す</button>');
  var w=document.getElementById('warn');
  w.style.display = notes.length ? 'block' : 'none';
  w.innerHTML = notes.join('<br>');

  var lh='<option value="">（なし）</option>';
  c.members.forEach(function(m){ if(m.blockKey) lh+='<option value="'+esc(m.name)+'">'+esc(m.name)+'</option>'; });
  document.getElementById('long').innerHTML=lh;

  var sel=document.getElementById('date'), h='';
  (c.candidates||[]).forEach(function(x,i){ h+='<option value="'+i+'">'+esc(x.display)+'</option>'; });
  sel.innerHTML = h || '<option value="">開催日が計算できません</option>';
  document.getElementById('count').textContent='メンバー '+c.members.length+'名';
  onDate();
}

// 開催日を変えると、始まりの区分を自動で選び直す
function onDate(){
  var i=parseInt(document.getElementById('date').value,10), cand=(ctx.candidates||[])[i];
  var list=live(), sh='';
  list.forEach(function(b){ sh+='<option value="'+esc(b.gkey)+'">'+esc(b.block)+'（'+b.count+'名）</option>'; });
  var sel=document.getElementById('start');
  sel.innerHTML = sh || '<option value="">対象のメンバーがいません</option>';
  // 2分30秒プレゼンの方は、ルーティンチェックシートの記載を初期値にする
  var ls=document.getElementById('long'), note=document.getElementById('longNote');
  if(cand){
    ls.value = cand.longPresenter || '';
    if(cand.longPresenter){
      note.innerHTML='<b>'+esc(cand.routineSheet)+'</b> の記載（'+esc(cand.longPresenterRaw)+'）から選んでいます。';
    } else if(cand.longUnmatched){
      note.innerHTML='<span style="color:#c60;">ルーティンチェックシートに「'+esc(cand.longPresenterRaw)
        +'」とありますが、メンバー名簿の氏名と一致しませんでした。手で選んでください。</span>';
    } else {
      note.innerHTML='いない日は「（なし）」のまま。選ぶと、その方の個人ページだけ <b>2:30</b> からのカウントダウンになります。';
    }
  }
  startKey = (cand && cand.start) || (list.length ? list[0].gkey : '');
  var ok=false;
  list.forEach(function(b){ if(b.gkey===startKey) ok=true; });
  if(!ok && list.length) startKey=list[0].gkey;
  sel.value=startKey;
  document.getElementById('startNote').textContent =
    'この日の順番から自動で選んでいます。1つずらしたいときだけ変えてください。';
  render();
}

// 始まりの区分から、いつもの並びを一周ぶん
function order(){
  var list=live(), at=0;
  for(var i=0;i<list.length;i++) if(list[i].gkey===startKey) { at=i; break; }
  return list.slice(at).concat(list.slice(0,at));
}

function render(){
  startKey = document.getElementById('start').value || startKey;
  var seq=order(), oh='<tr><th></th><th>業種区分</th><th>人数</th><th>先頭</th></tr>';
  seq.forEach(function(b,i){
    var list=membersOf(b.gkey);
    oh+='<tr class="'+(i===0?'first':'')+(b.known?'':' unknown')+'">'
      +'<td class="n">'+(i+1)+'</td><td>'+esc(b.block)+'</td>'
      +'<td class="num">'+b.count+'名</td><td>'+esc(list.length?list[0].name:'―')+'</td></tr>';
  });
  document.getElementById('ord').innerHTML=oh;

  var items=buildItems(), ov=0, ind=0;
  items.forEach(function(x){ if(x.kind==='overview') ov++; else ind++; });
  var sh='<tr><th>内容</th><th>枚数</th></tr>'
    +'<tr><td>業種区分の扉ページ</td><td class="num">'+ov+'枚</td></tr>'
    +'<tr><td>個人ページ</td><td class="num">'+ind+'枚</td></tr>'
    +'<tr><th>合計</th><th class="num">'+items.length+'枚</th></tr>';
  var lg=items.filter(function(x){ return x.countdownSec; });
  if(lg.length) sh+='<tr><td>2分30秒プレゼン</td><td class="num">'+esc(lg[0].name)+'</td></tr>';
  var wide=items.filter(function(x){ return x.kind==='individual' && x.companyLines.length>1; });
  if(wide.length){
    sh+='<tr><td colspan="2" style="color:#888;font-size:11px;line-height:1.6;">'
      +'会社名が2行以上になる方 '+wide.length+'名<br>'
      +wide.map(function(x){ return esc(x.name)+'（'+x.companyLines.length+'行'
        +(x.companyPt?' '+x.companyPt+'pt':'')+'）'; }).join('、')+'</td></tr>';
  }
  document.getElementById('sum').innerHTML=sh;
  refresh();
}

// 業種区分ごとに「扉ページ（7名ずつ）→ 個人ページ」を並べる
// 並びの組み立ては slides_layout.html の memberPresenItems()（定例会スライドと共通）
function buildItems(){
  var el=document.getElementById('auto'), auto=(!el || el.checked);
  var longName=(document.getElementById('long')||{}).value||'';
  return memberPresenItems(ctx, startKey, longName, auto);
}

function refresh(){
  document.getElementById('gen').disabled =
    working || !ctx || !ctx.template || !ctx.template.registered || !buildItems().length;
}
function show(t,ok){ var m=document.getElementById('msg'); m.innerText=t;
  m.style.color = ok===true?'green':(ok===false?'#d00':'#0055ff'); }
function fail(e){ show('エラー: '+((e&&e.message)?e.message:e),false); working=false; refresh(); }

// 誰も使っていない業種区分をマスタから消す（消す前に中身を見せる）
function tidy(){
  working=true; refresh(); show('確認中...',null);
  google.script.run.withSuccessHandler(function(r){
    working=false; refresh();
    if(!r.ok){ show(r.message,false); return; }
    if(!r.removed.length){ show(r.message,true); return; }
    if(!confirm(r.message+'\n\nよろしいですか？')){ show('やめました。',null); return; }
    working=true; refresh(); show('整理しています...',null);
    google.script.run.withSuccessHandler(function(r2){
      working=false;
      show(r2.message, r2.ok);
      if(r2.ok) load();
    }).withFailureHandler(fail).tidyCategoryMaster(true);
  }).withFailureHandler(fail).tidyCategoryMaster(false);
}

function gen(){
  var i=parseInt(document.getElementById('date').value,10), cand=(ctx.candidates||[])[i];
  var label=cand ? cand.dateValue.replace(/\//g,'') : '';
  var items=buildItems();
  if(!items.length){ alert('作成するスライドがありません。'); return; }
  working=true; refresh();
  show('PowerPointを作成中です。テンプレートが大きいので1〜2分かかることがあります...',null);
  google.script.run.withSuccessHandler(function(r){
    working=false; refresh();
    if(!r.ok){ show(r.message,false); return; }
    document.getElementById('msg').innerHTML='<span style="color:green;">'+esc(r.message)+'</span><br>'
      +'<a class="dl" href="'+(r.downloadUrl||r.url)+'" target="_blank">⬇ PowerPointをダウンロード</a> '
      +'<a href="'+r.url+'" target="_blank" style="font-size:12px;color:#666;">ドライブで見る</a>';
  }).withFailureHandler(fail).generateMemberPresenSlides({ dateLabel:label, items:items });
}
</script>
</body></html>
