<!-- 定例会スライド（前半・後半）の画面で共通の部品。
     slides_meeting_first.html / slides_meeting_second.html の head で include('slides_meeting_common') して読む。
     各画面は ready()（作成できる状態か）と collect()（差し込む値）を用意する。 -->
<style>
 body{font-family:sans-serif;padding:18px;font-size:13px;margin:0;}
 h3{margin:0 0 4px;color:#c00000;}
 .hint{font-size:12px;color:#666;line-height:1.7;margin-bottom:12px;}
 .warn{background:#fffbe8;border-left:4px solid #ffc107;padding:9px 12px;font-size:12px;border-radius:0 4px 4px 0;margin-bottom:12px;line-height:1.7;}
 .loading{position:sticky;top:0;z-index:5;background:#e8f0fe;border:1px solid #aecbfa;color:#174ea6;
          padding:9px 12px;font-size:13px;border-radius:6px;margin-bottom:12px;line-height:1.6;}
 .loading .sp{display:inline-block;width:12px;height:12px;border:2px solid #aecbfa;border-top-color:#174ea6;
              border-radius:50%;animation:spin 0.9s linear infinite;vertical-align:-2px;margin-right:6px;}
 @keyframes spin{to{transform:rotate(360deg);}}
 .sec{border:1px solid #ddd;border-radius:6px;padding:12px;margin-bottom:12px;}
 .sec h4{margin:0 0 8px;font-size:13px;color:#0055ff;}
 .auto{background:#e8f5e9;color:#188038;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;}
 .mk{margin-top:10px;border-top:1px dashed #ddd;padding-top:9px;}
 .mk h5{margin:0 0 6px;font-size:12px;color:#555;font-weight:bold;}
 .mkrow{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;}
 .mkrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#222;}
 .mkrow .dt{color:#999;font-size:11px;white-space:nowrap;}
 /* 下の button{} が color:#fff・font-weight:bold を効かせてしまい、
    白地に白文字で読めなくなっていた。
    button.mkbtn と書いて、確実に button{} より強くする。 */
 button.mkbtn{border:1px solid #888;background:#fff;color:#222;font-weight:normal;
        border-radius:3px;font-size:11px;padding:3px 9px;cursor:pointer;white-space:nowrap;}
 button.mkbtn:hover{background:#eef1f6;border-color:#444;}
 button.mkbtn.on{background:#188038;color:#fff;border-color:#188038;}
 button.mkbtn.off{background:#b0453a;color:#fff;border-color:#b0453a;}
 .mkdone{color:#888;font-size:11px;line-height:1.8;}
 .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
 label{font-size:12px;color:#444;}
 input[type=text],select{padding:5px;border:1px solid #ccc;border-radius:4px;font-size:13px;}
 input.wide{width:100%;box-sizing:border-box;}
 button{border:none;padding:9px 16px;border-radius:5px;cursor:pointer;font-weight:bold;font-size:13px;background:#c00000;color:#fff;}
 button.sub{background:#fff;color:#0055ff;border:1px solid #0055ff;padding:6px 12px;font-size:12px;}
 button:disabled{opacity:.5;cursor:default;}
 table{border-collapse:collapse;width:100%;font-size:12px;}
 th,td{border:1px solid #e3e3e3;padding:5px 7px;text-align:left;} th{background:#f7f9fc;width:120px;}
 table.ord th{width:auto;}
 table.ord td.num{text-align:right;white-space:nowrap;color:#666;}
 table.ord tr.first td{background:#fff5f5;font-weight:bold;}
 #msg{margin-top:12px;font-weight:bold;white-space:pre-wrap;}
 a.dl{display:inline-block;margin-top:8px;background:#0055ff;color:#fff;padding:8px 16px;border-radius:5px;text-decoration:none;font-weight:bold;}
</style>
<script>
 // ===== 定例会スライド（前半・後半）で共通 =====
 var ctx=null, working=false, loading={};
 function esc(x){var d=document.createElement('span');d.textContent=x==null?'':x;return d.innerHTML;}
 function val(id,v){ var e=document.getElementById(id); if(e) e.value = v==null?'':v; }
 function get(id){ var e=document.getElementById(id); return e?e.value:''; }
 function show(t,ok){ var m=document.getElementById('msg'); m.innerText=t; m.style.color= ok===true?'green':(ok===false?'#d00':'#0055ff'); }
 function fail(e){ var d=(e&&e.message)?e.message:String(e);
   document.getElementById('msg').innerHTML='<span style="color:#d00;">エラー: '+esc(d)+'</span>'
    +'<br><span style="font-size:12px;color:#666;">「サーバーエラー」と出る場合は、メニュー「🔧 Googleの権限を確認・許可する」を1回実行してください。</span>';
   setBusy(false); }

 // --- 読み込み中の表示 ---
 // 読み込んでいるものを並べて出し、終わるまで「作成」を押せないようにする。
 function loadStart(key,label){ loading[key]=label; renderLoading(); }
 function loadEnd(key){ delete loading[key]; renderLoading(); }
 function isLoading(){ for(var k in loading) return true; return false; }
 function renderLoading(){
   var names=[], k;
   for(k in loading) names.push(loading[k]);
   var el=document.getElementById('loading');
   el.style.display = names.length ? 'block' : 'none';
   el.innerHTML = names.length ? '<span class="sp"></span><b>読み込み中…</b> '+names.map(esc).join('／') : '';
   refreshGen();
 }
 // サーバーを呼ぶ。呼んでいる間は「読み込み中」に label を出す
 function loadFrom(key,label,fn,args,onOk){
   loadStart(key,label);
   var r=google.script.run.withSuccessHandler(function(res){ loadEnd(key); onOk(res); })
     .withFailureHandler(function(e){ loadEnd(key); fail(e); });
   r[fn].apply(r, args||[]);
 }
 function refreshGen(){
   var b=document.getElementById('genBtn');
   if(b) b.disabled = working || isLoading() || !ready();
 }
 function setBusy(b,t){ working=b; refreshGen(); if(t) show(t,null); }

 // --- 開催日 ---
 function initMeetings(c){
   var sel=document.getElementById('meeting'), h='';
   (c.meetings||[]).forEach(function(m){ h+='<option value="'+esc(m.dateValue)+'">'+esc(m.display)+'</option>'; });
   sel.innerHTML=h||'<option value="">開催日候補がありません</option>';
   if(c.defaultMeeting){
     var mm=(c.defaultMeeting.display||'').match(/第(\d+)回/); val('no', mm?mm[1]:'');
   }
 }
 // 開催日を選び直したとき、開催回を候補の表示から入れ直す（ルーティンチェックシートの値で上書きされる）
 function meetingNoFromList(){
   var d=get('meeting'), m=((ctx&&ctx.meetings)||[]).filter(function(x){return x.dateValue===d;})[0];
   if(m){ var mm=(m.display||'').match(/第(\d+)回/); val('no', mm?mm[1]:''); }
 }
 // --- 欠席の方（ウィークリープレゼン・リファーラル発表のページを作らない）---
 // ルーティンチェックシートの「代理・欠席」の「欠席」「医療欠席」の欄から（getRoutineInfo の absentees）。
 // 代理を立てた方は、代理の方が発表するので入れない。画面でチェックを外す・方を足すことができる。
 // 各画面は、変わったときに呼ぶ absentChanged() と、出す場所 <div id="abBox"> を用意する
 var absent={ list:[], on:{}, raw:'', unknown:[], found:false };
 function absentFromRoutine(R){
   var found=!!(R && R.ok && R.found), a=found ? (R.absentees||null) : null;
   absent={ list:[], on:{}, raw:a?(a.raw||''):'', unknown:a?(a.unknown||[]):[], found:found };
   ((a&&a.names)||[]).forEach(function(n){ if(absent.list.indexOf(n)<0){ absent.list.push(n); absent.on[n]=true; } });
   renderAbsent();
 }
 // ページを作らない方 { 氏名: true }
 function absentSkip(){ var s={}; absent.list.forEach(function(n){ if(absent.on[n]) s[n]=true; }); return s; }
 function renderAbsent(){
   var box=document.getElementById('abBox'); if(!box) return;
   var h=absent.list.length ? absent.list.map(function(n,i){
       return '<label style="margin-right:12px;white-space:nowrap;"><input type="checkbox" id="ab_'+i+'"'+(absent.on[n]?' checked':'')
         +' onchange="absentToggle('+i+')"> '+esc(n)+'</label>'; }).join('')
     : '<span style="color:#888;margin-right:12px;">いません</span>';
   var opts='<option value="">（欠席の方を足す）</option>';
   ((ctx&&ctx.members)||[]).forEach(function(m){
     if(m.name && absent.list.indexOf(m.name)<0) opts+='<option value="'+esc(m.name)+'">'+esc(m.name)+'</option>'; });
   h+='<select id="abAdd" onchange="absentAdd()">'+opts+'</select>';
   var notes=[];
   if(absent.raw) notes.push('ルーティンチェックシートの記載：'+esc(absent.raw));
   else if(absent.found) notes.push('ルーティンチェックシートの「欠席」「医療欠席」の欄は空です。');
   if(absent.unknown.length) notes.push('<span style="color:#c60;">名簿の方と結びつかなかった書き方：'+esc(absent.unknown.join('、'))
     +'（メンバーの方なら「欠席の方を足す」で選んでください）</span>');
   notes.push('チェックの入った方のページは作りません。代理を立てた方は、代理の方が発表するので入れていません。');
   box.innerHTML=h+'<div style="font-size:11px;color:#888;margin-top:4px;line-height:1.7;">'+notes.join('<br>')+'</div>';
 }
 function absentToggle(i){
   var n=absent.list[i], e=document.getElementById('ab_'+i);
   if(n==null || !e) return;
   absent.on[n]=!!e.checked; absentChanged();
 }
 function absentAdd(){
   var n=get('abAdd'); if(!n) return;
   if(absent.list.indexOf(n)<0) absent.list.push(n);
   absent.on[n]=true; renderAbsent(); absentChanged();
 }

 function memberOf(name){ return ((ctx&&ctx.members)||[]).filter(function(x){return x.name===name;})[0]||{}; }
 // withGuests … メインプレゼン①②・抽選の欄。名簿の方のあとに、アンバサダー・ディレクターも並べる
 // （ディレクターがメインプレゼンを担当する週がある）。（なし）は1人の週に選ぶ
 function memberOptions(withGuests){
   var mh='<option value="">（なし）</option>';
   ((ctx&&ctx.members)||[]).forEach(function(m){ mh+='<option value="'+esc(m.name)+'">'+esc(m.name)+'</option>'; });
   if(withGuests && guests && guests.length){
     mh+='<optgroup label="アンバサダー・ディレクター">';
     guests.forEach(function(g){ mh+='<option value="'+esc(g.name)+'">'+esc(g.name)+(g.role?'（'+esc(g.role)+'）':'')+'</option>'; });
     mh+='</optgroup>';
   }
   return mh;
 }
 // 欄の選択肢を入れ直す（アンバサダー・ディレクターの一覧が届いたとき）。選んである方はそのまま
 function presenterOptions(ids){
   var mh=memberOptions(true);
   ids.forEach(function(id){ var e=document.getElementById(id); if(!e) return; var v=e.value; e.innerHTML=mh; e.value=v; });
 }
 // 左右にお2人が並ぶページ（氏名・会社名・カテゴリーは名簿から引く）。
 // アンバサダー・ディレクターは、前半テンプレートのその方のページから（会社名の枠・カテゴリーの枠の文字。
 // カテゴリーの枠には「BNI東京千代田リージョン」のようにリージョンの名前が入っている）
 function twoPersonValues(m, prefix, idPrefix){
   [1,2].forEach(function(n){
     var name=get(idPrefix+n), g=guestOf(name);
     m[prefix+n+'氏名']=name;
     if(g){
       m[prefix+n+'会社名']=CB_.normalize(g.company||'');
       m[prefix+n+'カテゴリー']=roleInBrackets(g.role);
       return;
     }
     var who=memberOf(name), title=flatCell(who.title);
     m[prefix+n+'会社名']=flatCell(who.company);
     m[prefix+n+'カテゴリー']=title?('【'+title+'】'):'';
   });
 }
 function roleInBrackets(role){ var r=flatCell(role); return !r ? '' : (/^【[\s\S]*】$/.test(r) ? r : '【'+r+'】'); }

 // --- アンバサダー・ディレクター（前半テンプレートのその方のページ。getWeeklyGuests）---
 // guests … [{ name, role（カテゴリーの枠の文字）, company, hasPhoto, hidden, intro }]（届くまでは null）
 var guests=null;
 function nameKey(s){ return String(s||'').normalize('NFKC').replace(/[\s　]/g,''); }
 // 名簿の方でない、アンバサダー・ディレクターのその方（欄で選んだ氏名から）
 function guestOf(name){
   if(!name || memberOf(name).name) return null;
   return (guests||[]).filter(function(g){ return g.name===name; })[0]||null;
 }
 // ルーティンチェックシートの書き方（「空想ED」の役職を外した「空想」、または氏名）に当たる方。サーバーの guestByName_ と同じ決め方：
 // 氏名がそのまま同じ方 → 名字（氏名の頭）が同じ方が1人だけ のとき。当たらなければ null
 function guestByText(text){
   var t=nameKey(String(text||'').replace(/(さん|様)$/,''));
   if(!t || !guests) return null;
   var same=guests.filter(function(g){ return nameKey(g.name)===t; });
   if(same.length) return same[0];
   var head=guests.filter(function(g){ return nameKey(g.name).indexOf(t)===0; });
   return head.length===1 ? head[0] : null;
 }

 // --- メインプレゼン①②をルーティンチェックシートから（R.mainPresenters。routine_srv.js の routineMainPresenters_）---
 // [{ raw, name, matched, kind: 'member'|'director', guest }]（2人まで。「②なし」は入っていない＝1人の週）。
 //   メンバー … 名簿の氏名。ディレクター … アンバサダー・ディレクターのページの方（guest＝役職を外した呼び名で探す）
 // → { names: [①, ②], members: [メンバーの方], directors: [入れたディレクター], unknown: [名簿に無い書き方],
 //     missingDir: [ページの見つからないディレクター], waiting: 一覧がまだ届いていないディレクターがいるか, count: 人数 }
 function mainPresenterPlan(mp){
   var p={ names:['',''], members:[], directors:[], unknown:[], missingDir:[], waiting:false, count:0 };
   (mp||[]).slice(0,2).forEach(function(x,i){
     p.count++;
     if(x.kind==='director'){
       var g=guestByText(x.guest||x.raw) || guestByText(x.raw);
       if(g){ p.names[i]=g.name; p.directors.push(g.name); }
       else if(!guests) p.waiting=true;
       else p.missingDir.push(x.raw);
       return;
     }
     p.names[i]=x.name||'';
     if(x.name) p.members.push(x.name);
     else if(x.raw) p.unknown.push(x.raw);
   });
   return p;
 }
 // メインプレゼンの欄の下の知らせ（1人の週・ディレクターの週は、落ち着いた知らせ。合わない書き方だけ色を付ける）
 function mainPresenterNote(R, p){
   var raw=R.mainPresentersRaw||'';
   if(p.unknown.length || p.missingDir.length){
     var t=[];
     if(p.unknown.length) t.push(esc(p.unknown.join('・'))+' は名簿の氏名と一致しませんでした');
     if(p.missingDir.length) t.push(esc(p.missingDir.join('・'))+' は、前半テンプレートのアンバサダー・ディレクターのページに見つかりませんでした');
     return '<span style="color:#c60;">ルーティンチェックシートの「'+esc(raw)+'」から、'+t.join('。')+'。手で選んでください。</span>';
   }
   if(!raw) return '';
   var s='記載：'+esc(raw);
   if(p.count===1) s+='（1人の週です。②は（なし）にしました）';
   if(p.directors.length) s+='<br>ディレクター：'+esc(p.directors.join('さん・'))+'さん（会社名・カテゴリー・写真は、前半テンプレートのその方のページから入れます）';
   if(p.waiting) s+='<br>ディレクターの方は、アンバサダー・ディレクターのページを読み込んでから入れます。';
   return s;
 }
 // 名簿のセルの中の改行を外す（英数字のあいだだけ空白に）。改行が残ると、ページの行が増えて下の段に重なる
 function flatCell(s){
   var t=String(s==null?'':s);
   return t.replace(/[ \t]*[\r\n]+[ \t]*/g, function(x, at){
     return /[A-Za-z0-9]/.test(t.charAt(at-1)) && /[A-Za-z0-9]/.test(t.charAt(at+x.length)) ? ' ' : '';
   }).trim();
 }
 function baseValues(){
   var m={}, sel=document.getElementById('meeting');
   m['開催回']=get('no');
   m['開催日']=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:'';
   m['開催日付']=get('meeting');
   return m;
 }
 function templateWarn(kind,label){
   if(ctx && ctx.templates && ctx.templates[kind]) return true;
   var w=document.getElementById('warn'); w.style.display='block';
   w.innerHTML+=(w.innerHTML?'<br>':'')+'テンプレート未登録：<b>'+esc(label)+'</b>。'
     +'メニュー「⚙️ 設定」＞「大きなスライド」でDriveの共有リンクを登録してください。';
   return false;
 }

 // --- 作成 ---
 function genSlides(kind, opts){
   if(isLoading()){ show('読み込み中です。終わるまでお待ちください。',null); return; }
   setBusy(true,'PowerPointを作成しています。ファイルが大きいので1〜2分かかります...');
   google.script.run.withSuccessHandler(function(r){
     setBusy(false);
     if(!r.ok){ show(r.message,false); return; }
     document.getElementById('msg').innerHTML='<span style="color:green;">'+esc(r.message).replace(/\n/g,'<br>')+'</span>'
       +'<br><a class="dl" href="'+(r.downloadUrl||r.url)+'" target="_blank">⬇ PowerPointをダウンロード</a> '
       +'<a href="'+r.url+'" target="_blank" style="font-size:12px;color:#666;">ドライブで見る</a>';
   }).withFailureHandler(fail).generateMeetingSlides(kind, collect(), get('meeting'), opts);
 }

 // 反映されたかどうかを画面で確かめられるようにする
 google.script.run.withSuccessHandler(function(v){
   var e=document.getElementById('ver'); if(e && v) e.textContent='版 '+v;
 }).getSystemVersion();
</script>
