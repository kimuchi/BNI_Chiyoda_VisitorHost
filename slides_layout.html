<!-- 会社名・カテゴリーの組版。メンバープレゼンとリファーラル発表で共通に使う。
     文字幅はブラウザのcanvasで実測する（GASには文字を測る手段が無いため）。 -->
<script>
// ===== 組版（元の生成ツールと同じ計算をここで行う）=====
// 文字幅はブラウザのcanvasで実測する。サーバー（GAS）には文字を測る手段が無いため、
// 折り返し位置・文字の大きさ・枠の寸法はここで決め、結果だけをサーバーへ渡す。

// 枠の位置（EMU）。メンバープレゼンのテンプレートから採った実測値を既定にし、
// 別のテンプレート（リファーラル発表など）では setLayoutBoxes() で差し替える。
var COMPANY_DEFAULT = { x: 4830858, y: 2849608, cx: 7461517, cy: 769441 };   // 会社名が1行
var COMPANY_TALL    = { x: 5087424, y: 2776058, cx: 6893161, cy: 1446550 };  // 会社名が2行
var CATEGORY_TOP = 3456634, CATEGORY_TOP_LOW = 4071101;                      // 【カテゴリー】の上端
var CATEGORY_W_PT = 7311519 / 12700;                                         // カテゴリーの枠の幅

// 文字の大きさ（pt）。会社名44pt・カテゴリー32ptにそろえる（チャプターの決まり）。
// 以前は1行に収まるまで1人ずつ小さくしていたため、人によって大きさがバラバラだった。
// 入りきらないときは、同じ大きさのまま2行にし、2行にも入らないほど長いときだけ小さくする。
// テンプレートの文字の大きさ（公式ファイルから作った雛形の companyPt・categoryPt）には合わせない
var UNIFIED_COMPANY_PT = 44, UNIFIED_CATEGORY_PT = 32;
var COMPANY_PT = UNIFIED_COMPANY_PT, CATEGORY_PT = UNIFIED_CATEGORY_PT;

// テンプレートの実測値で置き換える。
//   { companyTall, categoryLow, categoryWidth } … リファーラル発表（元ツールの寸法のひな形）。
//       会社名が1行のときの枠は、2行の枠の上端をそのままに高さだけ縮めて作る
//   { companyDefault, categoryTop, categoryWidth, companyPt, categoryPt } … 公式ファイルから作った雛形。
//       会社名が2行のときの枠は、1行の枠の上端をそのままに高さだけ伸ばし、カテゴリーもそのぶん下げる
//       （companyPt・categoryPt は使わない。大きさは会社名44pt・カテゴリー32ptにそろえる）
function setLayoutBoxes(box) {
  if (!box || !(box.companyTall || box.companyDefault)) return;
  COMPANY_PT = UNIFIED_COMPANY_PT; CATEGORY_PT = UNIFIED_CATEGORY_PT;   // 大きさはそろえる（枠の位置だけテンプレートから）
  var catTop = box.categoryTop || 0;
  if (box.companyTall) {
    COMPANY_TALL = box.companyTall;
    COMPANY_DEFAULT = box.companyDefault || {
      x: COMPANY_TALL.x, y: COMPANY_TALL.y, cx: COMPANY_TALL.cx,
      cy: Math.round(PAD_EMU + 1 * COMPANY_PT * LINE_EMU)
    };
  } else {
    // 雛形の枠が、そろえた大きさ（44pt）の1行より低いときは、1行ぶんの高さまで伸ばし、カテゴリーもそのぶん下げる
    var d0 = box.companyDefault, grow = Math.max(0, Math.round(PAD_EMU + 1 * COMPANY_PT * LINE_EMU) - d0.cy);
    COMPANY_DEFAULT = { x: d0.x, y: d0.y, cx: d0.cx, cy: d0.cy + grow };
    COMPANY_TALL = { x: COMPANY_DEFAULT.x, y: COMPANY_DEFAULT.y, cx: COMPANY_DEFAULT.cx,
                     cy: Math.max(COMPANY_DEFAULT.cy, Math.round(PAD_EMU + 2 * COMPANY_PT * LINE_EMU)) };
    if (catTop) catTop += grow;
  }
  CATEGORY_TOP = catTop || (COMPANY_DEFAULT.y + COMPANY_DEFAULT.cy - GAP_EMU);
  CATEGORY_TOP_LOW = box.categoryLow
    || (catTop ? catTop + (COMPANY_TALL.cy - COMPANY_DEFAULT.cy) : (COMPANY_TALL.y + COMPANY_TALL.cy - GAP_EMU));
  if (box.categoryWidth) CATEGORY_W_PT = box.categoryWidth / 12700;
}
// 小さくしていく下限（元ツールの 44pt → 28pt・20pt と同じ割合）
function minPtOf(base){ return Math.round(base * MIN_PT / BASE_PT); }
function hardMinPtOf(base){ return Math.round(base * HARD_MIN_PT / BASE_PT); }
// 1pt・1行ぶんの高さと枠の上下余白。上の2つの枠から逆算した値で、
// 3行以上になったときに枠と【カテゴリー】の位置を自分で出すために使う。
var LINE_EMU = 12700 * 1.213, PAD_EMU = 91440;
var GAP_EMU = 151507;          // 会社名の枠の下端と【カテゴリー】の上端の差
var BASE_PT = 44, MIN_PT = 28, HARD_MIN_PT = 20;

function widthPt(g){ return g.cx / 12700; }

function measurePt(text, sizePt, bold){
  if(!measurePt._c){ measurePt._c = document.createElement('canvas').getContext('2d'); }
  measurePt._c.font = (bold?'bold ':'') + sizePt + 'px "Meiryo UI","Hiragino Kaku Gothic ProN",sans-serif';
  return measurePt._c.measureText(text).width;
}
// カタカナ・漢字の続き（語の途中）。「・」は語の区切りなので含めない（「建設業許可・外国人ビザ」を「・」のあとで折れるように）
function isProtectedChar(ch){ return /[゠-ヺー-ヿ一-鿿]/.test(ch); }
// 行の頭に来てはいけない字
var NO_LINE_START = /[・ー、。，．）)」』】〕ッャュョァィゥェォっゃゅょぁぃぅぇぉ々！？!?:：;；,.]/;

// カタカナ語や熟語の途中で改行されないように、折り返し位置を自前で決める
function wrapKinsoku(text, sizePt, bold, maxWidthPt){
  var lines=[], cur='';
  for(var i=0;i<text.length;i++){
    var ch=text[i], test=cur+ch;
    if(cur.length>0 && measurePt(test,sizePt,bold)*1.15 > maxWidthPt){
      var br=cur.length, noStart=NO_LINE_START.test(ch);
      // 語の途中で折らない。「・」「）」などを行の頭にしないときも、前の語ごと次の行へ
      if((isProtectedChar(ch) || noStart) && isProtectedChar(cur[cur.length-1])){
        var j=cur.length-1;
        while(j>0 && isProtectedChar(cur[j-1])) j--;
        if(j>0) br=j;
        else if(noStart && cur.length>1) br=cur.length-1;
      } else if(noStart && cur.length>1){
        br=cur.length-1;
      }
      lines.push(cur.slice(0,br));
      cur=cur.slice(br)+ch;
    } else cur=test;
  }
  if(cur) lines.push(cur);
  return lines;
}
// 最後の行が「ー】」のように短すぎるときは、前の行にくっつけて体裁を整える
function mergeOrphan(lines){
  if(lines.length>1 && lines[lines.length-1].length<=2){
    return lines.slice(0,-2).concat([lines[lines.length-2]+lines[lines.length-1]]);
  }
  return lines;
}
function normParens(s){ return String(s==null?'':s).replace(/（/g,'(').replace(/）/g,')'); }
function expandCorp(s){ return String(s==null?'':s).replace(/㈱/g,'株式会社').replace(/㈲/g,'有限会社').replace(/㈾/g,'合資会社'); }
var CORP_SUFFIXES=['株式会社','有限会社','合同会社','合資会社'];
function splitCorp(text){
  for(var i=0;i<CORP_SUFFIXES.length;i++){
    var s=CORP_SUFFIXES[i];
    if(text.length>s.length && text.slice(-s.length)===s) return { main:text.slice(0,-s.length), suffix:s };
  }
  return null;
}

// 文字の大きさは、いつも書いて渡す（テンプレートの大きさのままにすると、そろわないため）
function companyFit(lines, pt, geom, catTop){
  return { lines:lines, fontPt:pt, geom:geom, categoryTop:catTop };
}
function fitsOneLine(text, pt, wPt){ return wrapKinsoku(text, pt, true, wPt).length <= 1; }
// 「社名／株式会社」「株式会社／社名」の2行。どちらの行も1行に入るときだけ（無ければ null）
function corpLines(text, pt, wPt){
  var sp=splitCorp(text);
  if(sp && fitsOneLine(sp.main, pt, wPt)) return [sp.main, sp.suffix];
  for(var i=0;i<CORP_SUFFIXES.length;i++){
    var s=CORP_SUFFIXES[i], rest=text.slice(s.length).replace(/^[\s　]+/,'');
    if(text.slice(0,s.length)===s && rest && fitsOneLine(rest, pt, wPt)) return [s, rest];
  }
  return null;
}
// 2行に折ったとき、2行目が1〜2文字だけにならないよう、切れ目を少し前へ（語の途中では切らない）
function rebalance2(lines){
  if(lines.length!==2 || lines[1].length>2) return lines;
  var s=lines[0]+lines[1], c=Math.max(1, s.length-3);
  for(var k=c;k>Math.max(1,c-6);k--){ if(!(isProtectedChar(s[k-1])&&isProtectedChar(s[k]))){ c=k; break; } }
  return [s.slice(0,c), s.slice(c)];
}
// 行数と文字の大きさから、枠の高さと【カテゴリー】の位置を出す
function companyCalc(lines, pt){
  var g = { x:COMPANY_TALL.x, y:COMPANY_TALL.y, cx:COMPANY_TALL.cx,
            cy:Math.round(PAD_EMU + lines.length * pt * LINE_EMU) };
  return companyFit(lines, pt, g, Math.round(g.y + g.cy - GAP_EMU));
}

// 会社名の収め方（44pt）。上から順に試し、収まったところで決める。
//  ① ㈱などの略記があれば、元ツールと同じく展開して「社名／株式会社」で折る（2行・44pt）
//  ② 1行に入れば、そのまま（44pt）… ほとんどの方はここ
//  ③ 同じ大きさのまま2行：「社名／株式会社」「株式会社／社名」で折れればそこで、無理なら語の切れ目で（44pt）
//  ④ 2行にも入らないほど長いときだけ、小さくする（2行で28ptまで → 3行で20ptまで）
// ④では枠の高さと【カテゴリー】の位置を実際の行数から出し直す。
// 2行決め打ちのままだと、3行になったときに【カテゴリー】と文字が重なる。
function layoutCompany(raw){
  var wasAbbrev=/[㈱㈲㈾]/.test(raw||''), text=expandCorp(raw);
  var base=COMPANY_PT, min=minPtOf(base), hard=hardMinPtOf(base);
  if(!text) return companyFit([''], base, COMPANY_DEFAULT, CATEGORY_TOP);
  var w1=widthPt(COMPANY_DEFAULT), w2=widthPt(COMPANY_TALL), sp=splitCorp(text);
  if(wasAbbrev && sp && fitsOneLine(sp.main, base, w2)) return companyFit([sp.main,sp.suffix], base, COMPANY_TALL, CATEGORY_TOP_LOW);
  var lines=wrapKinsoku(text,base,true,w1);
  if(lines.length<=1) return companyFit(lines, base, COMPANY_DEFAULT, CATEGORY_TOP);
  var two=corpLines(text, base, w2);
  if(two) return companyFit(two, base, COMPANY_TALL, CATEGORY_TOP_LOW);
  lines=rebalance2(wrapKinsoku(text,base,true,w2));
  if(lines.length<=2) return companyFit(lines, base, COMPANY_TALL, CATEGORY_TOP_LOW);

  var pt=base;
  while(lines.length>2 && pt>min){ pt-=2; lines=wrapKinsoku(text,pt,true,w2); }
  while(lines.length>3 && pt>hard){ pt-=2; lines=wrapKinsoku(text,pt,true,w2); }
  lines=mergeOrphan(lines);
  return companyCalc(lines, pt);
}

// カテゴリー（32pt）：【】で囲む。1行に入らなければ、同じ大きさのまま2行（行間を少し詰める）。
// 2行にも入らないほど長いときだけ小さくする（20ptまで）
function layoutCategory(rawTitle){
  var text='【'+normParens(rawTitle||'')+'】', base=CATEGORY_PT, min=minPtOf(base), pt=base;
  var lines=wrapKinsoku(text,pt,true,CATEGORY_W_PT);
  if(lines.length<=1) return { lines:lines, fontPt:pt, tight:false };
  if(lines.length===2) return { lines:rebalance2(lines), fontPt:pt, tight:true };
  while(lines.length>2 && pt>min){ pt-=2; lines=wrapKinsoku(text,pt,true,CATEGORY_W_PT); }
  return { lines:mergeOrphan(lines), fontPt:pt, tight:true };
}

// ===== 枠の位置を一時的に切り替える =====
// 1つの画面でメンバープレゼン（既定の枠）とリファーラル発表（別の枠）の両方を
// 組むことがあるので、切り替えたら必ず元に戻す。
var LAYOUT_DEFAULTS_ = { cd: COMPANY_DEFAULT, ct: COMPANY_TALL, top: CATEGORY_TOP,
                         low: CATEGORY_TOP_LOW, w: CATEGORY_W_PT, cp: COMPANY_PT, ap: CATEGORY_PT };
function withLayoutBoxes(box, fn){
  var saved = { cd: COMPANY_DEFAULT, ct: COMPANY_TALL, top: CATEGORY_TOP, low: CATEGORY_TOP_LOW, w: CATEGORY_W_PT,
                cp: COMPANY_PT, ap: CATEGORY_PT };
  try{
    COMPANY_DEFAULT = LAYOUT_DEFAULTS_.cd; COMPANY_TALL = LAYOUT_DEFAULTS_.ct;
    CATEGORY_TOP = LAYOUT_DEFAULTS_.top; CATEGORY_TOP_LOW = LAYOUT_DEFAULTS_.low; CATEGORY_W_PT = LAYOUT_DEFAULTS_.w;
    COMPANY_PT = LAYOUT_DEFAULTS_.cp; CATEGORY_PT = LAYOUT_DEFAULTS_.ap;
    if (box) setLayoutBoxes(box);
    return fn();
  } finally {
    COMPANY_DEFAULT = saved.cd; COMPANY_TALL = saved.ct;
    CATEGORY_TOP = saved.top; CATEGORY_TOP_LOW = saved.low; CATEGORY_W_PT = saved.w;
    COMPANY_PT = saved.cp; CATEGORY_PT = saved.ap;
  }
}

// ===== メンバープレゼンのページの並び =====
// 業種区分ごとに「扉ページ（7名ずつ）→ 個人ページ」を並べる。
// メンバープレゼンの画面と、定例会スライド（前半に差し込むとき）の両方から使う。
//   mctx     … getMemberPresenContext() の結果
//   startKey … 始まりの業種区分
//   longName … スタートアッププレゼンの方（いなければ空）
//   auto     … カウントダウンが終わったら自動で次へ進むか
// カウントダウンの秒数は、チャプターの設定（mctx.seconds）。無ければ Activeチャプターの値
var MP_SECONDS_DEFAULT = { weekly: 30, startup: 150 };
function memberPresenSeconds(mctx){
  var s=(mctx&&mctx.seconds)||{};
  return { weekly: s.weekly||MP_SECONDS_DEFAULT.weekly, startup: s.startup||MP_SECONDS_DEFAULT.startup };
}
// 150 →「2分30秒」
function secondsLabel(sec){
  var m=Math.floor(sec/60), r=sec%60;
  return m ? m+'分'+(r ? r+'秒' : '') : r+'秒';
}
// 始まりの業種区分をどこから決めたか（画面に出す一言。textContent で使う）
//   c … getMemberPresenContext() の candidates の1つ
function memberPresenStartNote(c){
  if(!c) return '';
  if(c.startFrom==='routine') return 'ルーティンチェックシートの記載（'+c.startRaw+'）から選んでいます。';
  if(c.startFrom==='previous') return 'この日の記載はまだ無いので、前回の記載（'+c.startRawDate+'：'+c.startRaw+'）から'
    +c.startSteps+'回ぶん進めています。';
  return 'ルーティンチェックシートに記載が無いため、開催日から計算しています。';
}
function memberPresenOrder(mctx, startKey){
  var live = (mctx.blocks||[]).filter(function(b){ return b.count>0; }), at = 0;
  for (var i=0;i<live.length;i++) if (live[i].gkey===startKey) { at=i; break; }
  return live.slice(at).concat(live.slice(0,at));
}
function memberPresenItems(mctx, startKey, longName, auto){
  var S=memberPresenSeconds(mctx);
  // 枠の寸法：テンプレートから採ったもの（公式ファイルから作った雛形）。無ければ元ツールの寸法
  return withLayoutBoxes(mctx.layoutBoxes || null, function(){
    var items=[], rows=mctx.rowsPerPage||7;
    memberPresenOrder(mctx, startKey).forEach(function(b){
      var list=(mctx.members||[]).filter(function(m){ return m.blockKey===b.gkey; });
      if(!list.length) return;
      var pages=Math.ceil(list.length/rows);
      for(var p=0;p<pages;p++){
        items.push({ kind:'overview', block:b.block, photoName:list[0].name, nextName:list[0].name,
          rows:list.slice(p*rows,(p+1)*rows).map(function(m){
            return { title:normParens(m.title||''), name:m.name }; }) });
      }
      list.forEach(function(m,i){
        var co=layoutCompany(m.company||''), ca=layoutCategory(m.title||'');
        var isLong=(!!longName && m.name===longName);
        items.push({ kind:'individual', photoName:m.name, name:m.name,
          // カウントダウンの秒数（テンプレートと同じ秒数なら、サーバーは作り直さない）。
          // auto … カウントダウンが終わってから1秒おいて次のスライドへ
          countdownSec:(isLong?S.startup:S.weekly), auto:!!auto,
          companyLines:co.lines, companyPt:co.fontPt, companyGeom:co.geom, categoryTop:co.categoryTop,
          companyTall:(co.geom!==COMPANY_DEFAULT),
          categoryLines:ca.lines, categoryPt:ca.fontPt, categoryTight:ca.tight,
          nextName:(list[i+1]?list[i+1].name:'') });
      });
    });
    return items;
  });
}
</script>
