<!DOCTYPE html>
<html><head><base target="_top">
<style>
 body{font-family:sans-serif;padding:18px;font-size:14px;margin:0;}
 h3{margin:0 0 6px;color:#16233f;}
 .hint{font-size:12px;color:#666;line-height:1.7;margin-bottom:14px;}
 .box{border:1px solid #ddd;border-radius:6px;padding:12px;margin-bottom:12px;}
 label{font-size:13px;} input{padding:5px;border:1px solid #ccc;border-radius:4px;font-size:13px;}
 button{border:none;padding:10px 18px;border-radius:5px;cursor:pointer;font-weight:bold;font-size:13px;background:#16233f;color:#fff;}
 button.sub{background:#fff;color:#16233f;border:1px solid #16233f;padding:7px 13px;font-size:12px;}
 button:disabled{opacity:.5;cursor:default;}
 #msg{margin-top:12px;font-weight:bold;white-space:pre-wrap;}
 .warn{background:#fffbe8;border-left:4px solid #ffc107;padding:9px 12px;font-size:12px;border-radius:0 4px 4px 0;margin-bottom:12px;}
 .note{font-size:11px;color:#888;margin-top:4px;line-height:1.6;}
</style></head>
<body>
 <h3>Zoom入室案内の作成</h3>
 <div class="hint">
   メンバー名簿の氏名を<b>6列・縦読み</b>で並べたA4横の案内を作ります。<br>
   ボタンを押すと印刷画面が開くので、送信先で「PDFに保存」を選んでください。
 </div>
 <div class="warn" id="warn" style="display:none;"></div>

 <div class="box">
   <div style="margin-bottom:8px;">
     <label>例に出すメンバー番号：<input type="number" id="ex" min="1" style="width:70px;"></label>
   </div>
   <div>
     <label>人数の表記：<input type="text" id="title" style="width:150px;" placeholder="51名"></label>
   </div>
   <div style="margin-top:10px;">
     <label><input type="checkbox" id="realCat"> 「（カテゴリー）」の代わりに、各メンバーの実際のカテゴリーを表示する</label>
     <div class="note">
       既定はチェックなしです。名前の付け方を示すための案内なので、
       ひな形として「（カテゴリー）」と表示します。
     </div>
   </div>
   <div class="note">現在の登録：<span id="cnt">-</span></div>
 </div>

 <button id="btn" onclick="makePdf()">📥 Zoom入室案内を作成（印刷）</button>
 <button class="sub" onclick="saveSet()">この設定を保存</button>
 <div id="msg"></div>

<script>
 var members=[];
 window.onload=function(){ google.script.run.withSuccessHandler(init).withFailureHandler(fail).getZoomGuideContext(); };
 function esc(x){var d=document.createElement('span');d.textContent=x==null?'':x;return d.innerHTML;}
 function fail(e){ document.getElementById('msg').innerText='エラー: '+((e&&e.message)?e.message:e);
   document.getElementById('msg').style.color='#d00'; document.getElementById('btn').disabled=false; }
 function init(c){
   if(!c.ok){ fail({message:c.message}); return; }
   members=c.members||[];
   document.getElementById('ex').value=c.exampleNum||4;
   document.getElementById('title').value=c.title||(members.length+'名');
   document.getElementById('cnt').textContent=members.length+'名';
   if(!members.length){
     var w=document.getElementById('warn'); w.style.display='block';
     w.innerHTML='メンバー名簿が空です。「⚙️ 設定」＞「メンバー名簿」で取り込んでから作成してください。';
     document.getElementById('btn').disabled=true;
   }
 }
 function saveSet(){
   google.script.run.withSuccessHandler(function(r){
     document.getElementById('msg').innerText=r.message; document.getElementById('msg').style.color=r.ok?'green':'#d00';
   }).withFailureHandler(fail).saveZoomGuideSettings({
     exampleNum:document.getElementById('ex').value, title:document.getElementById('title').value});
 }

 // ✔ のアイコン。4つのチェック項目で使い回す
 function checkItem(text){
   return '<div class="zoom-check">'
     +'<div class="zoom-check-icon"><svg viewBox="0 0 24 24" fill="none">'
     +'<path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
     +'</svg></div>'
     +'<div class="zoom-check-text">'+text+'</div></div>';
 }

 function makePdf(){
   if(!members.length){ alert('メンバー名簿が空です。'); return; }
   var exNum=parseInt(document.getElementById('ex').value,10)||4;
   var title=document.getElementById('title').value||(members.length+'名');
   var realCat=document.getElementById('realCat').checked;

   // 各メンバーのカテゴリー表記。既定は書き方のひな形としての「（カテゴリー）」
   function catOf(m){
     return (realCat && m.cat) ? '（'+esc(m.cat)+'）' : '（カテゴリー）';
   }

   // 6列に分割。列ごとに縦へ連番が並ぶ（1列目が先頭から、2列目がその続き）
   var perCol=Math.ceil(members.length/6), cols=[];
   for(var c=0;c<6;c++){
     var items=[];
     for(var j=0;j<perCol;j++){
       var idx=c*perCol+j;
       if(idx>=members.length) break;
       var m=members[idx];
       items.push('<div class="zoom-member">'
         +'<span class="zoom-num">'+esc(('0'+m.no).slice(-2))+'</span>'
         +'<span class="zoom-name">'+esc(m.name)+'</span>'
         +'<span class="zoom-cat">'+catOf(m)+'</span></div>');
     }
     cols.push(items.join(''));
   }

   // 例。番号は入力された数字をそのまま使い、氏名はその番号のメンバーから引く
   var exMember=null;
   for(var k=0;k<members.length;k++){ if(String(members[k].no)===String(exNum)){ exMember=members[k]; break; } }
   if(!exMember) exMember=members[exNum-1];
   var exDisplay=('0'+exNum).slice(-2)
     + (exMember ? esc(exMember.name)+catOf(exMember) : '〇〇 〇〇（カテゴリー）');

   var html='<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<title>Zoom入室案内</title>\n<style>'
    +'*{box-sizing:border-box;margin:0;padding:0;}'
    +'body{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#16233f;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'
    +'@page{size:A4 landscape;margin:0;}'
    +'.zoom-wrap{width:297mm;min-height:210mm;background:#16233f;padding:6mm 7mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;}'
    +'.zoom-title{text-align:center;font-size:30pt;font-weight:900;color:#fff;letter-spacing:.01em;margin-bottom:2mm;}'
    +'.zoom-title .warn{color:#ffd200;}'
    +'.zoom-title .hl{color:#ffd200;}'
    +'.zoom-subtitle{text-align:center;font-size:12pt;color:#fff;margin-bottom:4mm;}'
    +'.zoom-subtitle .red{color:#ff5a5a;font-weight:700;}'
    +'.zoom-rule{display:flex;align-items:stretch;gap:3mm;margin-bottom:4mm;}'
    +'.zoom-rule-label{background:#0f1a30;border-radius:4pt;padding:4mm 6mm;display:flex;align-items:center;justify-content:center;}'
    +'.zoom-rule-label span{color:#fff;font-size:13pt;font-weight:800;white-space:nowrap;}'
    +'.zoom-rule-main{background:#fff;border-radius:4pt;flex:1;display:flex;align-items:center;justify-content:center;padding:4mm;}'
    +'.zoom-rule-main .red{color:#c0392b;font-weight:900;}'
    +'.zoom-rule-main span{font-size:20pt;font-weight:900;color:#1a2744;}'
    +'.zoom-rule-ex{background:#ffd200;border-radius:4pt;padding:4mm 6mm;display:flex;align-items:center;gap:3mm;white-space:nowrap;}'
    +'.zoom-rule-ex .ex-badge{background:#16233f;color:#fff;font-size:13pt;font-weight:900;padding:1mm 3mm;border-radius:3pt;}'
    +'.zoom-rule-ex .ex-text{color:#16233f;font-size:15pt;font-weight:900;}'
    +'.zoom-checks{display:flex;gap:2mm;margin-bottom:4mm;}'
    +'.zoom-check{flex:1;background:#1e2c4a;border:1pt solid #2d3f63;border-radius:4pt;padding:3mm;display:flex;align-items:center;gap:2mm;}'
    +'.zoom-check-icon{width:6mm;height:6mm;background:#16233f;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}'
    +'.zoom-check-icon svg{width:4mm;height:4mm;}'
    +'.zoom-check-text{font-size:9pt;color:#fff;line-height:1.4;}'
    +'.zoom-list-header{background:#16233f;border:1.5pt solid #16233f;border-bottom:none;border-radius:4pt 4pt 0 0;padding:2.5mm;text-align:center;}'
    +'.zoom-list-header span{color:#fff;font-size:13pt;font-weight:800;}'
    +'.zoom-list-body{background:#fff;border:1.5pt solid #16233f;border-top:none;border-radius:0 0 4pt 4pt;padding:3mm 3mm;display:flex;gap:2mm;}'
    +'.zoom-col{flex:1;min-width:0;}'
    +'.zoom-member{display:flex;align-items:baseline;gap:1mm;padding:1.5mm 0;border-bottom:1pt dashed #c3cbd9;white-space:nowrap;overflow:hidden;}'
    +'.zoom-num{color:#16233f;font-size:9.5pt;font-weight:800;flex-shrink:0;}'
    +'.zoom-name{color:#16233f;font-size:9.5pt;font-weight:700;flex-shrink:0;}'
    +'.zoom-cat{color:#8896b3;font-size:7.5pt;flex-shrink:0;}'
    +'.zoom-footer{background:#0f1a30;border-radius:4pt;padding:3mm;text-align:center;margin-top:4mm;}'
    +'.zoom-footer span{color:#fff;font-size:12pt;font-weight:700;}'
    +'.zoom-footer .red{color:#ff5a5a;}'
    +'</style>\n</head>\n<body>\n'
    +'<div class="zoom-wrap">'
    +'<div class="zoom-title"><span class="warn">⚠</span> 入室時に<span class="hl">お名前表記</span>のご確認をお願いします <span class="warn">⚠</span></div>'
    +'<div class="zoom-subtitle">スポットライト等で番号が必要なため、<span class="red">お間違いのないよう</span>お願いします。</div>'
    +'<div class="zoom-rule">'
    +'<div class="zoom-rule-label"><span>名前表記ルール</span></div>'
    +'<div class="zoom-rule-main"><span><span class="red">番号（半角）</span>名前（カテゴリー）</span></div>'
    +'<div class="zoom-rule-ex"><span class="ex-badge">例</span><span class="ex-text">'+exDisplay+'</span></div>'
    +'</div>'
    +'<div class="zoom-checks">'
    + checkItem('番号は半角数字で入力してください')
    + checkItem('番号抜け／番号違いにご注意ください')
    + checkItem('カテゴリーもご入力をお願いいたします')
    + checkItem('入室時に表示名のご確認をお願いいたします')
    +'</div>'
    +'<div class="zoom-list-header"><span>メンバー一覧（'+esc(title)+'）</span></div>'
    +'<div class="zoom-list-body">'
    + cols.map(function(col){ return '<div class="zoom-col">'+col+'</div>'; }).join('')
    +'</div>'
    +'<div class="zoom-footer"><span>スムーズな会の進行のため、皆さまの<span class="red">ご協力</span>をよろしくお願いします✨</span></div>'
    +'</div>\n</body>\n</html>';

   // サンドボックス内から直接 print() すると親画面が対象になり得るため、別ウィンドウで開く
   var w=window.open('','_blank');
   if(!w){ document.getElementById('msg').innerText='ポップアップがブロックされました。ブラウザで許可してから再度お試しください。';
     document.getElementById('msg').style.color='#d00'; return; }
   w.document.open(); w.document.write(html); w.document.close();
   setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 600);
   document.getElementById('msg').innerText='印刷画面を開きました。送信先で「PDFに保存」を選んでください。';
   document.getElementById('msg').style.color='green';
 }
</script>
</body></html>
